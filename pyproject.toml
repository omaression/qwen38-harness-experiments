[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-harness"
dynamic = ["version"]
description = "An evaluation harness for an LLM bug-fix feature, with a paired regression gate that runs in CI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "the repository author" }]
keywords = ["llm", "evaluation", "regression testing", "continuous integration", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
# The harness itself needs nothing beyond the standard library.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
llm-eval = "llm_eval_harness.cli:main"

[tool.setuptools.dynamic]
version = { attr = "llm_eval_harness.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets `python -m pytest` run from a fresh checkout without installing the package.
pythonpath = ["src"]
